h_gimZesvcqHLROsN72OG9zDxdiRqW_sI4j_vz6f9BeUCZhC4nQK24adNmF5RSthRt7ZGH1KolkQb_5nOQ3HDmNBMVG3tWHedeMgD-n-dzmBXIcawKfcDcJxI8_OjUeMTRWt7MXdmy3N-yOc6OIXY7frH8uUIdsLXMoY/s16000/Gemini_Generated_Image_6xraal6xraal6xra.png",symbolMeaning:"Una lombriz de tierra, agente clave en la transformaci\xF3n y fertilidad del suelo. El Concepto para la Contemplaci\xF3n de la Fuerza Ra\xEDz del Suelo es: La Importancia de Vivir el Suelo en un Jard\xEDn y la Importancia de Practicar el Arte de la Jardiner\xEDa. Incluso si tu cuerpo y/o circunstancias no te permiten practicar la jardiner\xEDa como pr\xE1ctica principal del Yoga Esenio, haz lo que puedas; por ejemplo, una maceta de hierbas en una ventana o en el escal\xF3n de su puerta es mejor que ning\xFAn jard\xEDn.",messenger:"Adam'el",messengerMeaning:"En Mattanah, leemos: 'Ad\xE1n, en su arrepentimiento por ser el primer ser humano en comer carne, se convirti\xF3 en el primer y m\xE1s grande agricultor. S\xED, domin\xF3 el arte de la agricultura para poder ense\xF1ar a la gente a comer sin matar animales, porque, una vez que cay\xF3 Kush, el fruto de los \xE1rboles no fue suficiente para alimentar los cuerpos densos de la atm\xF3sfera menos et\xE9rea. Y cuando Lucifer supo que Ad\xE1n, a quien hab\xEDa ense\xF1ado a cazar animales, ahora era granjero, se burl\xF3 diciendo: \u201C\xA1Si Ad\xE1n hubiera seguido siendo cazador, ahora no estar\xEDa rompi\xE9ndose la espalda cultivando la tierra!\u201D. Pero Ad\xE1n amaba la agricultura y nunca m\xE1s dese\xF3 cazar o comer carne de animales. Y he aqu\xED: cuando Ad\xE1n muri\xF3, fue a Elkush y se le dio el cuerpo de un Querub\xEDn. He aqu\xED: se le dio el nombre de Adam'el, y ahora sirve como el \xC1ngel del Suelo del \xC1rbol de la Vida para este mundo. S\xED, y su esposa, Eva (Chawah'el), sirve como el \xC1ngel de la Vida, y vive con Adam en Elkush.'",videoUrl:"https://youtube.com/shorts/Sygk6v4uL7k",meditationText:"Pronuncia estas palabras: '\xA1\xC1ngel del suelo, donde estoy es suelo sagrado! \xA1As\xED como bendices los campos con fertilidad, haz fruct\xEDferas mis semillas!'"},midday:{angel:"Paz con la Madre Terrenal",element:"Armon\xEDa",invocation:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y al reino de nuestra Madre Terrenal, El \xC1ngel de la Alegr\xEDa.",icon:"Flower",symbolImage:"https://blogger.googleusercontent.com/img/a/AVvXsEjZQNzwsMbFypmjgPolnm5QwsLdhaacpdqZlxAfhCynU5BUd_M-skB8Eq1-xcK25Dw0I2ZGru8pUioKor6_AIJl9NC2NFgCHlIN3C2I2mhgWt-Tqh1m3bZ2_Y4Gfzo4OiFzr-uhvXk-ZTt_eQCR9iB-vt49qrFuxPB0JyaacZ4cG8WK-_MWHNdHBZcULAI=w640-h358",symbolMeaning:"Ense\xF1a la unidad indivisible del ser humano con el reino terrestre (los bosques, el suelo, el agua, el aire y la vegetaci\xF3n). Su concepto exige colaborar conscientemente con la vida vegetal y proteger el entorno, reconociendo que la supervivencia y vitalidad humana dependen de esta cooperaci\xF3n.",meditationText:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y al reino de nuestra Madre Terrenal, El \xC1ngel de la Alegr\xEDa.",wordsOfYahshua:`Bienaventurado el Hijo de la Luz que conoce a su Madre Terrenal, pues Ella es la dadora de Vida. Entiende que Madre est\xE1 en ti y tu est\xE1s en Ella; Ella te dio a luz y Ella te da la vida, Ella fue quien te dio cuerpo y a Ella se lo devolver\xE1s de nuevo un d\xEDa.

Sabed que la sangre que corre en ti, nace de tu Madre Tierra, su sangre cae de las nubes, salta de las entra\xF1as de la Tierra, murmura en los arroyos de las monta\xF1as, fluye en los r\xEDos amplios de los llanos, duerme en los lagos, brama impetuosa en los mares tempestuosos.

Sabed que el aire que respiras nace del aliento de la Madre Tierra, su alimento se vuelve azul en las alturas de los cielos, suspira en las cimas de las monta\xF1as, susurra en las hojas del bosque, se mece sobre los sembrados, se adormece en los valles profundos, se calienta en el desierto.

Sabed que la dureza de tus huesos nace de los huesos de la Madre Tierra, de las pe\xF1as, de las rocas.

Sabed que la delicadeza de tu carne nace de la carne de tu Madre Tierra, Ella cuya carne se torna amarilla y roja en los frutos de los \xE1rboles.

La luz de tus ojos, la audici\xF3n de tus o\xEDdos, \xE9stos nacen de los colores y los sonidos de tu Madre Tierra, que te envuelve a ti como las olas del mar envuelven al pez, como el aire al p\xE1jaro.

En verdad te digo, el hombre es el hijo de la Madre Tierra y de Ella el Hijo del Hombre recibe su cuerpo total, as\xED como el cuerpo de la criatura reci\xE9n nacida viene del vientre de su madre.

En verdad te digo, que tu eres uno con la Madre Tierra, ella est\xE1 en ti y tu est\xE1s en ella, de Ella naces, en Ella vives y a Ella regresar\xE1s de nuevo. Cumple por eso sus leyes, pues nadie puede vivir mucho, ni ser feliz, sino el que honra a su Madre Tierra y guarda sus leyes. Pues tu aliento es su aliento, tu sangre es su sangre, tus huesos son sus huesos, tu carne es su carne, tus ojos y tus o\xEDdos son sus ojos y sus o\xEDdos.

El que encuentra la Paz en su madre Tierra, nunca conocer\xE1 la muerte.

Conoced esta Paz con vuestra mente, desead esta Paz con vuestro coraz\xF3n, cumplid esta Paz con vuestro cuerpo.`},evening:{angel:"\xC1ngel del Trabajo Santo",element:"Abundancia",invocation:"\xC1ngel del Trabajo Santo, desciende sobre la humanidad y da abundancia a todos los hombres.",icon:"Hammer",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgdaekHdUTL2VCvfO9ZwsMPln4SFgJNuKxJ_WO1esOP5KI0BhMgUDKGI4VX8A2tGH_yk80CyHN_szQHTIRj_4IXI3wiZ5ur84gv0CgQH9yYNugubsKArZft2gytaSNKkqjn6o5QDaQs2TLH_YIOIe4GzQHAbck08UWrdkAo3bKFsHOQmg5_bDdBndpgNao/w430-h640/Gemini_Generated_Image_c4bocc4bocc4bocc.png",symbolMeaning:"Un tri\xE1ngulo formado por tres Hadas-Abejas (con franjas verdes y doradas y alas plateadas), que representan a la Trinidad Creativa ocupada en el trabajo de la creaci\xF3n. La pregunta reflexiva: \xBFC\xF3mo puedo ayudar mejor a la santa bondad aqu\xED y ahora?",messenger:"Ebed'el",messengerMeaning:"Comprenda esto sobre la elevaci\xF3n de Ebed al estado exaltado de \xC1ngel Mensajero Principal de La Rama del Trabajo Sagrado: la mayor\xEDa de sus buenas obras no se mencionan en la Meguil\xE1. Porque, las Obras Sagradas de Ebed fueron realizadas la mayor\xEDa de las veces sin que \xE9l tocara una trompeta o buscara reconocimiento. Aun as\xED, todas sus buenas obras fueron de hecho presenciadas por Elohim; pues, el Se\xF1or Cristo y la Se\xF1ora Cristo viven en los que viven en Nosotros. He aqu\xED: Ebed se convirti\xF3 en un yogui esenio muy avanzado. Su \xE9nfasis especial estaba en vivir y ense\xF1ar sobre Karma Yoga, que es el yoga del Trabajo Sagrado motivado por el Amor Supremo en la Sabidur\xEDa Suprema. Como Santo Ebed, que los Disc\xEDpulos del Co-Mesianismo del Se\xF1or Cristo y la Se\xF1ora Cristo realicen actos diarios sin trompeta de Obra Santa en Amorosa Bondad expresada en el campo de actividad que es la vida humana.",videoUrl:"https://youtube.com/shorts/6fUbpcI7SAY",meditationText:"Di estas palabras: '\xC1ngel del Santo Trabajo, ay\xFAdame a descubrir y realizar mi verdadero trabajo. Ayuda a otros a hacer lo mismo. Porque el hombre o la mujer que ha encontrado su verdadero trabajo no necesita pedir otra bendici\xF3n.'"}},1:{name:"Lunes",morning:{angel:"\xC1ngel de la Vida",element:"Vitalidad",invocation:"\xC1ngel de la Vida, entra en mis miembros y da fuerza a todo mi cuerpo.",icon:"Heart",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiFYwGVk2x4mIsW2vZtxXFdcS66-pQuMCVKQeaJ-uc9Eh-RPKtXK9GL3NTa_fxQjkIKeIxorjY45hpHJqLnmvME_K21gf3NQ2yZrgDPsMTbM_P2sVyJXMwNslurxv0cNgIaN5ehneng4W1l2t5OewiZ1GYw1lpa9EyWZDi5ad-dcKx6Xjnu3iG2NigWblI/s16000/Gemini_Generated_Image_jzprntjzprntjzpr.png",symbolMeaning:"Un rayo cayendo sobre la tierra. Cultivar y compartir la fuerza vital (Chai) mediante la naturaleza y los actos de misericordia.",messenger:"Chawah'el (Eva)",messengerMeaning:"Fue la primera en dar a luz en la Tierra. Ense\xF1\xF3 a vivificar la tierra junto a Ad\xE1n y ten\xEDa un poder sanador a trav\xE9s de su Fuerza Vital (Chai), tan concentrada que el solo toque de su mano bastaba para sanar.",videoUrl:"https://youtube.com/shorts/npNRtTVGKVM",meditationText:"Di estas palabras: '\xA1\xC1ngel de la Vida, llena mi cuerpo de fuerza vital! \xA1Entren mis manos para que pueda animar todo lo que toco!'"},midday:{angel:"Paz con la Cultura",element:"Sabidur\xEDa",invocation:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestro conocimiento El \xC1ngel de la Sabidur\xEDa.",icon:"BookOpen",symbolImage:"https://blogger.googleusercontent.com/img/a/AVvXsEjZQNzwsMbFypmjgPolnm5QwsLdhaacpdqZlxAfhCynU5BUd_M-skB8Eq1-xcK25Dw0I2ZGru8pUioKor6_AIJl9NC2NFgCHlIN3C2I2mhgWt-Tqh1m3bZ2_Y4Gfzo4OiFzr-uhvXk-ZTt_eQCR9iB-vt49qrFuxPB0JyaacZ4cG8WK-_MWHNdHBZcULAI=w640-h358",symbolMeaning:"Consiste en la absorci\xF3n del conocimiento acumulado en las obras maestras de la literatura, el arte, la filosof\xEDa y los libros sagrados legados por los maestros de todas las \xE9pocas. Su concepto es conectar con la verdad atemporal para impulsar la evoluci\xF3n de la conciencia sin reiniciar desde cero en cada generaci\xF3n.",meditationText:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestro conocimiento El \xC1ngel de la Sabidur\xEDa.",wordsOfYahshua:`Bienaventurado es el Hijo de la Luz que estudia en el libro de la Ley, ya que ser\xE1 como una l\xE1mpara en la oscuridad de la noche y una isla de verdad en un mar de falsedad. Pues sabed, que la palabra escrita que viene de Dios es un reflejo del Mar Celestial, as\xED como las estrellas brillantes reflejan la Paz del cielo.

Como las palabras de los antiguos est\xE1n grabadas con la mano de Dios en los manuscritos santos, as\xED est\xE1 la Ley grabada en los corazones de la fidelidad de quien los estudia. Pues como se dijo antes, que en el principio hab\xEDa gigantes en la Tierra y hombres poderosos de anta\xF1o, hombres de renombre. Y los Hijos de la Luz proteger\xE1n sus escrituras, para que no se conviertan otra vez como bestias y no conozcan el Reino de los \xE1ngeles.

Sabed tambi\xE9n, que solo a trav\xE9s de las escrituras encontrareis la Ley que no est\xE1 escrita, como la primavera que brota del campo tiene una fuente oculta en las profundidades secretas bajo la tierra; la Ley escrita es el instrumento por medio del cual la palabra escrita se entiende, como la rama muda de un \xE1rbol se convierte en melodiosa flauta en las manos del pastor.

Muchos hay que desear\xEDan estar en el valle tranquilo de la ignorancia, donde los ni\xF1os juegan y las mariposas danzan al sol en sus cortas horas de vida, pero nadie puede permanecer all\xED mucho y ascender las sombr\xEDas monta\xF1as del aprendizaje; muchos hay temerosos de cruzar y muchos hay que han ca\xEDdo golpeados y sangrando de sus empinadas y abruptas cuestas. Pero la fe es el gu\xEDa en el vac\xEDo del abismo y la perseverancia es el apoyo en las escabrosas pe\xF1as.

Mas all\xE1 de las heladas cumbres de lucha, yace la Paz y la belleza del Ed\xE9n Infinito de conocimiento, donde el significado de la Ley se da a conocer a los Hijos de la Luz.

Aqu\xED en el centro de su bosque, est\xE1 plantado el Arbol de la Vida, misterio de los misterios. El que ha encontrado Paz en las ense\xF1anzas de los antiguos, a trav\xE9s de la Luz de la mente, a trav\xE9s de la Luz de la naturaleza y a trav\xE9s del estudio de la Palabra Santa, ha entrado en la Mansi\xF3n suprema de los antiguos, donde mora la Hermandad Santa, de quien nadie puede hablar.

Conoced esta Paz con vuestra mente, desead esta Paz con vuestro coraz\xF3n, cumplid esta Paz con vuestro cuerpo.`},evening:{angel:"\xC1ngel de la Paz",element:"Armon\xEDa",invocation:"La Paz de tu Padre Celestial est\xE1 contigo. Que su Paz est\xE9 con todos.",icon:"Moon",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjtNhQZVMKdTCAJJ26Swux6j660m2kA7sDFBMWkXs9qcbGETAnlr2J368cZTo78TXrFeQcCl8FN0ejdVe5gx-5MbzW9Vd1eRCXgqP3if3NeZI00ALu6q2uEXUJa7WeWN5euRFQsL-nluItiSiykmmd2VEUur2KhbD4Nxw2SklFBo2_3jGgzscTtEdjCZFo/w430-h640/Gemini_Generated_Image_aa0mhaaa0mhaaa0m.png",symbolMeaning:"La Luna (llena o en cualquiera de sus fases), cuya luz representa el brillo de las almas que poseen paz interior. El Concepto Para La Contemplaci\xF3n De La Rama Fuerza De La Paz es: Armon\xEDa. La palabra hebrea que se traduce a otras lenguas como 'Paz' es 'Shalom'. Shalom no significa simplemente la ausencia temporal de guerra. Shalom es la Paz que es la armon\xEDa interior del pac\xEDfico. Los 'pac\xEDficos' est\xE1n 'llenos de paz' y as\xED hacen brillar su paz interior en su entorno exterior. He aqu\xED: incluso en medio de la guerra y el caos exterior, los pac\xEDficos pueden caminar all\xED en Misericordiosa Compasi\xF3n como Manos de Cristo y no perder su experiencia del Shalom Interior. Bienaventurados los pac\xEDficos, porque ellos han desposado el Amor y la Sabidur\xEDa y as\xED han dado a luz el Poder en la Vida Eterna y las Obras Santas. Su recompensa es la Paz Interior - Shalom - que tambi\xE9n se llama Cielo Interior. Esa Paz Interior es expresada por personas pac\xEDficas en las siete partes de La Paz S\xE9ptuple. \u201COtro buen Concepto para la Contemplaci\xF3n de la Fuerza Rama de la Paz es: Las vibraciones pac\xEDficas asociadas con planetas pac\xEDficos y personas pac\xEDficas. Habiendo imaginado esas Vibraciones Pac\xEDficas y luego contempladas, b\xFAscalas dentro y alrededor de ti. \u201CLos grados de 'paz comunitaria' o 'paz mundial' externa se correlacionan con el nivel de paz de los miembros de esa comunidad o mundo. Solo cuando tienes un nivel relativamente alto de Paz Interior - Shalom Interior - tienes las vibraciones requeridas para residir en comunidades y mundos relativamente 'celestiales'. Pero una forma de ascender a\xFAn m\xE1s alto es elegir realizar el Trabajo Sagrado en una comunidad o mundo m\xE1s violento de lo que requiere tu karma personal. Ese es el trabajo de los iniciados de La Familia Cr\xEDstica, pues esa orden est\xE1 dedicada a la expresi\xF3n de la Divina Misericordia en el Amor Universal. Aun as\xED, Christed Beings equilibrar\xE1 tales misiones a comunidades y mundos de confusi\xF3n con retiros celestiales en las regiones superiores de la conciencia grupal celestial. Porque, he aqu\xED: Sin equilibrio, uno puede tropezar y caer fuera de las Vibraciones Celestiales. Cuando uno visita una comunidad o un mundo m\xE1s violento de lo que exige su karma personal, a\xFAn puede disfrutar de las Vibraciones Celestiales en su interior ayudando a difundirlas en el exterior.",messenger:"Raphah'el",messengerMeaning:"En Mattanah, leemos lo siguiente sobre Raphah'el: 'Desde sus siete aldeas, los nasareanos atend\xEDan las necesidades de Kush. S\xED, incluso para las necesidades del mundo, porque ahora se estaban formando naciones fuera de los l\xEDmites de Kush. Y las naciones hicieron la guerra en uno. Raphah el Sanador se hizo conocida como Raphah el Pacificador, porque no solo cur\xF3 los cuerpos de los heridos por la guerra, sino que tambi\xE9n camin\xF3 por el mundo ense\xF1ando el camino de la paz. He aqu\xED: cuando estall\xF3 la guerra entre las naciones, ella visit\xF3 a los l\xEDderes de las naciones y les ense\xF1\xF3 el camino de la paz. Y Jud\xE1 estaba a su lado. Y en su vejez fueron asesinados mientras predicaban la paz. Pero s\xF3lo sus cuerpos fueron asesinados; porque, he aqu\xED: sus almas fueron a Elkush y les fueron dados cuerpos querubines. S\xED, a Jud\xE1 se le dio el nombre de Mika'el, y ahora sirve como el \xC1ngel del Poder del \xC1rbol de la Vida para este mundo. Y a Raphah se le dio el nombre de Raphah'el, que significa Sanador de Elohim, y ahora ocupa su lugar como el \xC1ngel de la Paz del \xC1rbol de la Vida para este mundo. Y Mika'el y Raphah'el son consortes eternos, como dos alas del \xC1rbol de la Vida.'",videoUrl:"https://youtube.com/shorts/nwQv3AaPn68",meditationText:"Di estas palabras: 'Paz, paz, paz; \xC1ngel de la Paz, s\xE9 siempre en todas partes.'"}},2:{name:"Martes",morning:{angel:"\xC1ngel de la Alegr\xEDa",element:"Felicidad",invocation:"\xC1ngel de la Alegr\xEDa, desciende a la tierra y da belleza a todos los seres.",icon:"Smile",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhn-dIdAgyX7m5Bf8nabzwnfBaD0jA7uPmsHbre9p01NLqsqoI3p8tVCs9XYjVLuDy9Xt5yoTdvGsmUgW64sETeIlU6PKpwLLojaPCX_54L8SKQqbBcAxcYpuZS6WVJHWbIhxjUsRcANzlQFFxr8k35w0s95rsxmljkc7b2Mg6PeKRyGUJ8V5vMOyQ6bGg/s16000/Gemini_Generated_Image_ots7wzots7wzots7.png",symbolMeaning:"Un rostro sonriente. Compartir la alegr\xEDa con alegr\xEDa en la vida cotidiana.",messenger:"Simchah'el",messengerMeaning:`La s\xE9ptima hija de Ad\xE1n y Eva, una alegre hija llamada Simj\xE1, hac\xEDa feliz a la gente con s\xF3lo su presencia. Le encantaba re\xEDr y bailar, y encontraba alegr\xEDa incluso en las tareas mundanas. He aqu\xED: cuando Simchah entraba en una habitaci\xF3n, la gente sent\xEDa alegr\xEDa dentro de s\xED misma, y \u200B\u200Bparec\xEDa que la habitaci\xF3n se iluminaba'. Yahshua dijo: \u201C\xA1Simchah ascendi\xF3 a Elkush sin morir primero! Leemos acerca de ese asombroso hecho en los siguientes versos de Mattanah: 'Porque Simchah significa Alegr\xEDa, y toda su vida fue el ep\xEDtome de la Alegr\xEDa. He aqu\xED: estaba tan contenta que no muri\xF3, sino que ascendi\xF3 al cielo. S\xED, y eso fue de esta manera: Riendo desde lo m\xE1s profundo de su alma, comenz\xF3 a bailar. Lo, ella gir\xF3 y gir\xF3 como un joven, luego salt\xF3 Sin embargo, cada uno seguir\xE1 su propio camino y cada uno comulgar\xE1 con su propio coraz\xF3n, pues en el Ed\xE9n Infinito hay muchas y diversas flores: \xBFQui\xE9n dir\xE1 que una es mejor porque su color es p\xFArpura, o que una es preferida porque su tallo es largo y delicado?

Aunque los hermanos sean de constituci\xF3n diferente, a\xFAn as\xED todos ellos trabajar\xE1n en la Vi\xF1a de la Madre Terrenal y todos ellos elevar\xE1n sus voces unidas en oraci\xF3n al Padre Celestial. Y juntos partir\xE1n el Santo Pan y en silencio compartir\xE1n el alimento santo de acci\xF3n de gracias.

No habr\xE1 paz entre los hombres, hasta que no haya un Ed\xE9n de la Hermandad sobre la faz de la Tierra. Pues, \xBFc\xF3mo puede haber paz cuando cada uno de los hombres busca su propio provecho y vende su alma a la esclavitud? Tu, Hijo de la Luz, re\xFAnete con tus hermanos y luego id y ense\xF1ad los senderos de la Ley a todos los que quisieran o\xEDr. El que ha encontrado la paz en la hermandad del hombre se ha hecho a si mismo el compa\xF1ero de la labor de Dios.

Conoced esta Paz con vuestra mente, desead esta Paz con vuestro coraz\xF3n, cumplid esta Paz con vuestro cuerpo.`},evening:{angel:"\xC1ngel del Poder",element:"Fuerza Espiritual",invocation:"\xC1ngel del Poder, desciende sobre la humanidad y dirige nuestros actos.",icon:"Zap",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEijxywMh09EPkZjXmqw4jUr9OUbjeCFy9tRmqBy08LOnG9LR018bI2PvoaV1Kibc2hOYAhk9jiSSzWNfZglGuxlY_9K5zMvqXWem5JsMcRYAXQJEYXay7aoP5YM7W06_412kP8X4AVEp2EOGQgtyYpJbxN78-vLR8qE7tzCgQ2GgIcxlhnlXuozOLQ3SVs/s16000/Gemini_Generated_Image_w4klluw4klluw4kl.png",symbolMeaning:"Las estrellas, entendidas como puentes entre los reinos espirituales y f\xEDsicos. El poder expansivo creativo nacido del nudo entre Sabidur\xEDa y Amor, as\xED como el uso sabio y amoroso del poder personal.",messenger:"Mika'el",messengerMeaning:"En Mattanah, leemos lo siguiente sobre Raphah'el: 'Desde sus siete aldeas, los nasareanos atend\xEDan las necesidades de Kush. S\xED, incluso para las necesidades del mundo, porque ahora se estaban formando naciones fuera de los l\xEDmites de Kush. Y las naciones hicieron la guerra en uno. Raphah el Sanador se hizo conocida como Raphah el Pacificador, porque no solo cur\xF3 los cuerpos de los heridos por la guerra, sino que tambi\xE9n camin\xF3 por el mundo ense\xF1ando el camino de la paz. He aqu\xED: cuando estall\xF3 la guerra entre las naciones, ella visit\xF3 a los l\xEDderes de las naciones y les ense\xF1\xF3 el camino de la paz. Y Jud\xE1 estaba a su lado. Y en su vejez fueron asesinados mientras predicaban la paz. Pero s\xF3lo sus cuerpos fueron asesinados; porque, he aqu\xED: sus almas fueron a Elkush y les fueron dados cuerpos querubines. S\xED, a Jud\xE1 se le dio el nombre de Mika'el, y ahora sirve como el \xC1ngel del Poder del \xC1rbol de la Vida para este mundo. Y a Raphah se le dio el nombre de Raphah'el, que significa Sanador de Elohim, y ahora ocupa su lugar como el \xC1ngel de la Paz del \xC1rbol de la Vida para este mundo. Y Mika'el y Raphah'el son consortes eternos, como dos alas del \xC1rbol de la Vida.'",videoUrl:"https://youtube.com/shorts/wB3cQfgV4Ag",meditationText:"Pronuncia estas palabras: '\xA1\xC1ngel del Poder, desciende sobre m\xED y da poder a todas mis acciones correctas!'"}},3:{name:"Mi\xE9rcoles",morning:{angel:"\xC1ngel del Sol",element:"Fuego Solar",invocation:"\xC1ngel del Sol, entra en mi centro solar y da fuego de vida a todo mi cuerpo.",icon:"Sun",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhlWRPuaYIBWDAtkU86C-PFx9oD9zYAEr88BZpNEq7yXPAb9wekdB8zX0i5XSCbhpAmVYEghuU1C4lt0HDla3EeOXK645rN6Zw_m2tjXQMMDgD7TG_eFCat1RMf6DQLbFboJpHKkXI2-TSEqxzxbCNffILTEN5p5f_7kAsNiwzyj45sHNGgGt8LX8cvVJs/s16000/Gemini_Generated_Image_oznen8oznen8ozne.png",symbolMeaning:"Una persona en meditaci\xF3n sentada en la hierba, rodeada de flores, un p\xE1jaro y un \xE1rbol frutal en actitud de gratitud hacia el sol. El Concepto para la Contemplaci\xF3n de la Fuerza Ra\xEDz del Sol es: Las m\xFAltiples bendiciones del sol en relaci\xF3n con la existencia humana. Dado que la existencia humana depende tambi\xE9n de una ecolog\xEDa viviente bendecida por el sol que consta de varias formas de vida no humanas que tambi\xE9n son bendecidas por el sol, deja que tu contemplaci\xF3n incluya esa conciencia.",messenger:"Abraham'el",messengerMeaning:"Tambi\xE9n conocido por los nombres Abraham el Abram, Abram'el y el Drag\xF3n Dorado. Sirve al Se\xF1or Cristo y a la Se\xF1ora Cristo como Sumo Sacerdote del Templo de la Luz dentro del S\xE9ptimo Cielo dentro del Sol. Tiene la capacidad de aparecer como un Drag\xF3n Dorado, dorado con un toque de flecos rojos, siendo masculino. Est\xE1 emparejado con Sa'arah, tambi\xE9n llamado Sa'arah'el, el principal \xE1ngel mensajero del aire; Sa'arah tiene la habilidad de aparecer como un Drag\xF3n de Plata, Plata con un toque de franja azul, siendo femenino. Ella sirve como Suma Sacerdotisa del Templo de la Luz. Su hijo, Noach'el, sirve como el Principal \xC1ngel Mensajero del Agua.",videoUrl:"https://youtube.com/shorts/-oy_xEWZrwk",meditationText:"Pronuncia estas palabras: '\xC1ngel del Sol, \xA1Me ba\xF1ar\xE9 en la Luz de tu fuego! \xA1Desde la base de mi columna hasta la coronilla de mi cabeza, que salga el Sol de Justicia con sus rayos curativos!'"},midday:{angel:"Paz con la Familia",element:"Cuerpo Sintiente",invocation:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestra familia y amigos El \xC1ngel del Amor.",icon:"Heart",symbolImage:"https://blogger.googleusercontent.com/img/a/AVvXsEjZQNzwsMbFypmjgPolnm5QwsLdhaacpdqZlxAfhCynU5BUd_M-skB8Eq1-xcK25Dw0I2ZGru8pUioKor6_AIJl9NC2NFgCHlIN3C2I2mhgWt-Tqh1m3bZ2_Y4Gfzo4OiFzr-uhvXk-ZTt_eQCR9iB-vt49qrFuxPB0JyaacZ4cG8WK-_MWHNdHBZcULAI=w640-h358",symbolMeaning:"Se refiere a la armon\xEDa en las relaciones inmediatas (familia, amigos y compa\xF1eros) mediante la direcci\xF3n de las emociones. El concepto consiste en utilizar la voluntad y el pensamiento para gobernar los impulsos inferiores (miedo e ira) y canalizar la fuerza del amor creativo.",meditationText:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestra familia y amigos El \xC1ngel del Amor.",wordsOfYahshua:`Bienaventurado es el Hijo de la Luz, que es puro de coraz\xF3n, ya que ver\xE1 a Dios. Pues as\xED como el Padre Celestial te ha dado su Esp\xEDritu Santo, y tu Madre Tierra su cuerpo santo, as\xED dar\xE9is Amor vosotros a todos tus hermanos; y tus verdaderos hermanos son todos aquellos que hacen la voluntad de su Padre Celestial y de su Madre Tierra.

Que tu Amor sea como el sol que brilla sobre todas las criaturas de la tierra y no prefiere una hierba mas que otra. Y este Amor fluir\xE1 como una fuente de hermano a hermano y cuando se consuma ser\xE1 restablecido, ya que el Amor es mas fuerte que la muerte. Y si un hombre no tiene Amor, construye un muro entre \xE9l y todas las criaturas de la tierra y con ello, \xE9l mora en soledad y dolor.

Oh, el hombre se puede convertir en un remolino violento que lleva a sus profundidades todo lo que flota demasiado cerca. Pues el coraz\xF3n es un mar con olas poderosas y el Amor y la Sabidur\xEDa deben apaciguarlo, como el c\xE1lido sol penetra a trav\xE9s de las nubes y calma al mar inquieto.

El que ha encontrado la paz en sus hermanos, ha entrado al Reino del Amor y ver\xE1 a Dios frente a frente. Conoced esta Paz con vuestra mente, desead esta Paz con vuestro coraz\xF3n, cumplid esta Paz con vuestro cuerpo.`},evening:{angel:"\xC1ngel del Amor",element:"Compasi\xF3n",invocation:"\xC1ngel del Amor, desciende sobre la humanidad y da amor a todos los seres.",icon:"HeartHandshake",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi7TOjgT885X2PRvLVWZqy6loIL_WC5Q6LJVU2qdR4xaeWoewPiGEq3gi7uULtp58TsRcxC1_fpIImDBdydPwRI-e6nyTI5tEv9Q2TbZztmy8g6N8fa6RYuFHCBhH4Har3fMp6-lltOp4xQS4uGwHHiSvptVh__BanrKUg9_0LVqOUG5Sb0ceh8gjpOgc0/s16000/Gemini_Generated_Image_l6y07ml6y07ml6y0.png",symbolMeaning:"Un coraz\xF3n con dos alas (Esperanza Suprema y Amor Supremo) dentro de un c\xEDrculo (que simboliza actos de misericordiosa compasi\xF3n universal). Los Siete Sentimientos Celestiales (Amor, Aprecio, Gratitud, Compasi\xF3n, Perd\xF3n, Empat\xEDa y la Felicidad de servir).",messenger:"Rachamah'el",messengerMeaning:`Llamada Rachamah, que significa Compasi\xF3n.
He aqu\xED, ella era el ep\xEDtome de la ternura al amar, de ser misericordiosa y compasiva en cada pensamiento, palabra y obra. S\xED, cuando lloraba por los que sufr\xEDan, sus l\xE1grimas eran agua curativa, como las l\xE1grimas de Jah-Jah.
Y su amor fue tanto para los hirientes como para los heridos, pues su compasi\xF3n no conoc\xEDa l\xEDmites.
Y la sabidur\xEDa de su hermano gemelo, Auriel, fue tal que insisti\xF3 en que ella estuviera a su lado en cada consulta importante, para que no s\xF3lo dictara la regla de la sabidur\xEDa de la mente, sino tambi\xE9n la sabidur\xEDa del coraz\xF3n.
Y cuando muri\xF3 siendo mujer y ascendi\xF3 a Elkush, Rachamah se convirti\xF3 en el \xC1ngel del Amor.
Y su nombre de Querub\xEDn es Rachamah'el, que significa Compasi\xF3n de Elohim.`,videoUrl:"https://youtube.com/shorts/tp_AtzJcF18?feature=share",meditationText:"Di estas palabras: '\xC1ngel de Amor, entra en mi cuerpo emocional y bautiza todos mis sentimientos en tu Oc\xE9ano de Amor.'"}},4:{name:"Jueves",morning:{angel:"\xC1ngel del Agua",element:"Circulaci\xF3n",invocation:"\xC1ngel del Agua, entra en mi sangre y da el agua de la vida a todo mi cuerpo.",icon:"Droplets",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjQXPL-ejeqZWrXuEiojj4bP55DvyNPnuPiElXoQ09ikgxVw5EvUGbO-ssKvTkGwyxqMMLNkGVCbRhJ3dhRZCwte1kdKK6ElSffFxFBimYahrUGowYyv25qtnHV7yvuy8bUBpS2LjFvd997cjK5nvhgnmcDmUJQ6H34RyPPwKBTMbQTQEe-Q1z1-hl8qTg/s16000/Gemini_Generated_Image_gnuspmgnuspmgnus.png",symbolMeaning:"La palabra hebrea para agua (Mayim) escrita dentro de la figura de un pez. Cuando sea pr\xE1ctico, es bueno realizar esta contemplaci\xF3n al mismo tiempo que se tiene contacto f\xEDsico con el agua, como en First Sip, su 'primer sorbo' de agua en cualquier d\xEDa, o mientras se ba\xF1a o realiza abluciones rituales de agua. Aunque esto se puede practicar cualquier d\xEDa a cualquier hora, es importante dedicarle tiempo de calidad en la ma\xF1ana cuando realiza su Comuni\xF3n semanal del \xC1rbol de la Vida con la Fuerza de la Ra\xEDz del Agua. Las abluciones rituales con agua y varios bautismos con agua juegan un papel importante en el yoga acu\xE1tico, \xA1pero no dejes que la cotidianidad del acto diario de beber agua te ciegue a la profundidad de ese acto! Porque he aqu\xED: \xBFqu\xE9 mayor acto de Uni\xF3n (Yoga) con el agua puede haber que tragarla y convertirse literalmente en uno con ella",messenger:"Noach'el",messengerMeaning:"Encarnaci\xF3n humana de Isaac (hijo de Abraham y Sa'arah) enviado para traer consuelo a la humanidad. Tras morir como hombre, ascendi\xF3 a Elkush como Noach'el, el \xC1ngel del Agua del \xC1rbol de la Vida.",videoUrl:"https://youtube.com/shorts/6Y792wrUNAo",meditationText:"Di estas palabras: '\xC1ngel del Agua, entra en mi sangre y dale el Agua de la Vida a todo mi cuerpo. Bautizadme por dentro y por fuera, para que quede completamente limpio.'"},midday:{angel:"Paz con la Mente",element:"Cuerpo Pensante",invocation:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestra mente El \xC1ngel de la Fuerza.",icon:"Zap",symbolImage:"https://blogger.googleusercontent.com/img/a/AVvXsEjZQNzwsMbFypmjgPolnm5QwsLdhaacpdqZlxAfhCynU5BUd_M-skB8Eq1-xcK25Dw0I2ZGru8pUioKor6_AIJl9NC2NFgCHlIN3C2I2mhgWt-Tqh1m3bZ2_Y4Gfzo4OiFzr-uhvXk-ZTt_eQCR9iB-vt49qrFuxPB0JyaacZ4cG8WK-_MWHNdHBZcULAI=w640-h358",symbolMeaning:"Representa la armon\xEDa en el plano del pensamiento, considerado la fuerza rectora superior que instiga tanto a los sentimientos como a los actos. Su concepto es sintonizar la mente individual con la Gran Ley universal para emitir pensamientos elevados que se unan al Oc\xE9ano C\xF3smico de Pensamientos.",meditationText:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestra mente El \xC1ngel de la Fuerza.",wordsOfYahshua:`Bienaventurado es el Hijo de la Luz, que es de mente sabia, es un campo bien arado que produce a plenitud y en abundancia. Pues si muestras un pu\xF1ado de semillas a un hombre sabio, \xE9l ver\xE1 con los ojos de su mente un trigal dorado, y si le muestras un pu\xF1ado de semillas a un necio, \xE9l ver\xE1 \xFAnicamente lo que tiene enfrente y las llamar\xE1 guijarros sin valor.

Y como el campo del hombre sabio que da grano en abundancia y el campo del necio da una cosecha solo de piedras, as\xED, es con nuestros pensamientos. Como el trigo dorado permanece oculto dentro del diminuto grano, as\xED est\xE1 el Reino del Cielo, oculto a nuestros pensamientos; si ellos estuvieran plenos del Poder, el Amor y la Sabidur\xEDa de los \xE1ngeles del Padre Celestial, nos llevar\xEDan al Mar Celestial, pero si ellos est\xE1n manchados de corrupci\xF3n, odio e ignorancia, encadenar\xE1n nuestros pies a columnas de dolor y sufrimiento.

Ning\xFAn hombre puede servir a dos se\xF1ores, ni pueden los pensamientos indignos permanecer en una mente llena con la Luz de la Ley. El que ha encontrado la Paz en la mente, ha aprendido a volar mas all\xE1 del Reino de los \xE1ngeles. Conoced esta Paz con vuestra mente, desead esta Paz con vuestro coraz\xF3n, cumplid esta Paz con vuestro cuerpo.`},evening:{angel:"\xC1ngel de la Sabidur\xEDa",element:"Entendimiento",invocation:"\xC1ngel de la Sabidur\xEDa, desciende sobre la humanidad y da sabidur\xEDa a todos los hombres.",icon:"BookOpen",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi03hr4ggHnzMvu4fGviC-rs3IcCZy-9bx-9c5K-TznKJIQdLhitxVGG7NYPO07JKN28HfAu_UrXy9nn7cSxyacX_p4FF1D6a8_RKODFmlJ_kuwR5PMRguSt2sR14gLqO19_21fg7y3EIeDcB_IKrmLfCYAuUBt6nX_jmCD9_MaUt3zYHLE9y4GN8NPINk/s16000/Gemini_Generated_Image_msindvmsindvmsin.png",symbolMeaning:"Una vela encendida, cuya llama a menudo se dibuja como la letra hebrea Yod. El significado de que la Sabidur\xEDa Divina le da el 'gui\xF1o final al Amor', integrando el conocimiento anal\xEDtico (masculino) y la intuici\xF3n (femenina).",messenger:"Auriel",messengerMeaning:"El hombre, Auriel, ascendi\xF3 para convertirse en el \xC1ngel Mensajero Principal de la Sabidur\xEDa precisamente porque practic\xF3 en su propia vida el matrimonio de Cabeza y Coraz\xF3n.",videoUrl:"https://youtube.com/shorts/xwJHdaf8yVc",meditationText:"Pronuncia estas palabras: '\xC1ngel de la Sabidur\xEDa, entra en mi mente e ilumina todos mis pensamientos.'"}},5:{name:"Viernes",morning:{angel:"\xC1ngel del Aire",element:"Respiraci\xF3n",invocation:"\xC1ngel del Aire, entra en mis pulmones y da el aire de la vida a todo mi cuerpo.",icon:"Wind",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg32LHvzyl2TjbOy1MRrHIJmXGMDNOE8uYMY-bjCEfmQm41yztYxjhEmQkPMn7BGuGuXs4MQm_tdCCNtpz9ztJG-GovBwrCNa5M-I4NKr5ZhSb13Q0q0CQxt25lC_2lud91wa9bBm5ssuFgEGR_PfVuSBOxR1E7Fj4jkCXTySHh2xCjIbUvg68Qozngx3c/s16000/Gemini_Generated_Image_us7ml5us7ml5us7m.png",symbolMeaning:"El Drag\xF3n de Plata Sa'arah volando en un cielo nocturno con la palabra Ruah (Aire/Esp\xEDritu) escrita en azul en su pecho. La importancia del aire limpio rico en Chai (el aliento de vida) para la salud personal y planetaria. El Concepto para la Contemplaci\xF3n de la Fuerza Ra\xEDz del Aire es: La Importancia Para La Salud Planetaria Y Personal Del Aire No Contaminado Rico En Chai, El Aire De La Fuerza Vital Que Es El Aliento De La Vida. Cuando se trata de 'Aire', lo m\xE1s importante es respirar aire relativamente limpio y ayudar a otros a disfrutar del mismo privilegio. Ese es uno de los prop\xF3sitos del Ej\xE9rcito Verde de Ishshah'el y su general Pedro la Pluma.",messenger:"Sa'arah'el",messengerMeaning:"Principal \xE1ngel mensajero del aire, con la habilidad de aparecer como un Drag\xF3n de Plata (femenino). Sirve como Suma Sacerdotisa del Templo de la Luz junto a Abraham'el. La Contemplaci\xF3n De La Fuerza Ra\xEDz Del Aire es: El Drag\xF3n Plateado Sa'arah Volando En Un Cielo Nocturno Oscuro Con La Palabra Nasariana Para El \xC1rbol De La Vida Fuerza Del Aire - Ruah - Escrita En Azul En Su Pecho. Esto simboliza que incluso Sa'arah ('Torbellino Creativo'), elegida por Elohim para servir como \xC1ngel Principal Mensajero del Aire ('Ruah'), tan poderosa que puede aparecer como un Drag\xF3n de Plata y volar por el aire, incluso ella depende del Aliento de Vida para su vida. Sus pulmones respiran el Ruah/Aire que ella sirve como \xC1ngel Mensajero Principal. Ruah es una palabra de g\xE9nero femenino; puede usarse para 'Esp\xEDritu' pero aqu\xED significa 'Aire'. La palabra Ruah en el pecho de Sa'arah est\xE1 escrita en azul porque, siendo el color del cielo, el azul se asocia a menudo con el aire.",videoUrl:"https://youtube.com/shorts/Mbjhr5pm0Z0",meditationText:"Di estas palabras: '\xC1ngel del Aire, entra en mis pulmones y dale el Aliento de Vida a todo mi cuerpo.'"},midday:{angel:"Paz con el Cuerpo",element:"Cuerpo Actuante",invocation:"Padre Nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestro cuerpo El \xC1ngel de la Vida.",icon:"Smile",symbolImage:"https://blogger.googleusercontent.com/img/a/AVvXsEjZQNzwsMbFypmjgPolnm5QwsLdhaacpdqZlxAfhCynU5BUd_M-skB8Eq1-xcK25Dw0I2ZGru8pUioKor6_AIJl9NC2NFgCHlIN3C2I2mhgWt-Tqh1m3bZ2_Y4Gfzo4OiFzr-uhvXk-ZTt_eQCR9iB-vt49qrFuxPB0JyaacZ4cG8WK-_MWHNdHBZcULAI=w640-h358",symbolMeaning:"El concepto central radica en comprender el cuerpo f\xEDsico como un producto divino, dise\xF1ado para ser el instrumento mediante el cual la sabidur\xEDa de la mente y el amor del coraz\xF3n se convierten en acciones. Busca mantener la vitalidad, la salud y la moderaci\xF3n en el organismo para actuar en armon\xEDa con el planeta y el cosmos.",meditationText:"Padre Nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a nuestro cuerpo El \xC1ngel de la Vida.",wordsOfYahshua:`S\xED, en verdad os digo, los caminos son siete a trav\xE9s del Ed\xE9n Infinito y cada uno debe ser cruzado por el cuerpo, el coraz\xF3n y la mente como Uno. No sea que vacil\xE9is y caig\xE1is en el abismo de la nada; pues como el ave no puede volar con un ala, as\xED vuestra ave de sabidur\xEDa necesita dos alas de Poder y Amor para sobrevolar los abismos hacia el Arbol Santo de Vida. Pues el cuerpo solo, es como una casa abandonada vista de lejos, que parec\xEDa hermosa pero es ruina y desolaci\xF3n vista de cerca. El cuerpo es como un coche hecho de oro y cuyo constructor lo coloca en un pedestal, renuente a da\xF1arlo con el uso; pero, como un \xEDdolo de oro, es feo y sin gracia, ya que \xFAnicamente en movimiento cumplir\xE1 su prop\xF3sito.

Como la oscuridad profunda de una ventana \u2013cuando el viento apaga su vela, es el cuerpo solo, sin coraz\xF3n y sin mente para llenarlo de luz.

Y el coraz\xF3n solo, es un sol sin tierra para iluminar; es una luz en el vac\xEDo, una bola de color ahogada en un mar de oscuridad. Ya que cuando un hombre ama, ese amor se transforma en su propia destrucci\xF3n si no hay mano firme para hacer buenas obras y no hay mente para tejer con las llamas del deseo un tapiz de salmos.

Como un torbellino en el desierto es el coraz\xF3n solo, sin cuerpo y sin mente para guiarlo cantando a trav\xE9s de los cipreses y pinos.

Y la mente sola, es un manuscrito santo que se ha deteriorado y debe ser enterrado, la verdad y la belleza de sus palabras no han cambiado, pero los ojos no pueden leer ya las inteligibles letras y se desmorona a pedazos en las manos.

As\xED es la mente sin el coraz\xF3n para darle palabras y sin el cuerpo para hacer sus obras. Pues \xBFde qu\xE9 sirve la sabidur\xEDa sin un coraz\xF3n para sentir y una lengua para darle voz? Est\xE9ril como el vientre de una anciana es la mente sola, sin coraz\xF3n y sin cuerpo para llenarla de vida.

Pues, en verdad os digo, el cuerpo, el coraz\xF3n y la mente son como un coche, un caballo y un cochero.

El coche es el cuerpo, creado con fortaleza para hacer la voluntad del Padre Celestial y la Madre Terrenal.

El coraz\xF3n es el corcel brioso, glorioso y valiente que lleva el coche brav\xEDamente, ya sea por un camino suave, o ya sea que haya piedras y palos atravesados en su camino.

Y el cochero es la mente, sosteniendo las riendas de la sabidur\xEDa, viendo desde arriba lo que hay en el horizonte lejano, dise\xF1ando el curso de las patas y las ruedas.

Prestad o\xEDdo, oh vosotros cielos y hablar\xE9; y escucha oh tierra, las palabras de mi boca.

Mi doctrina descender\xE1 como lluvia, mi palabra destilar\xE1 como el roc\xEDo, como la suave lluvia sobre la hierba tierna y como el chaparr\xF3n sobre el pasto.

Bienaventurado es el Hijo de la Luz, que es fuerte en cuerpo, pues ser\xE1 Uno con la Tierra. Celebrareis diariamente un banquete, con todos los dones del Angel de la Tierra:

El trigo y el cereal dorados, las uvas p\xFArpura de oto\xF1o, los frutos maduros de los \xE1rboles, la miel de las abejas.

Buscareis el aire fresco del bosque y los campos y en ellos encontrareis El Angel del Aire. Quitaos vuestras sandalias y vuestras vestiduras, sentid el Angel del Aire que envuelve todo vuestro cuerpo. Respirad luego, larga y profundamente, para que el Angel del Aire pueda penetrar dentro de vosotros.

Entrad en el r\xEDo fresco y fluido y sentid al Angel del Agua que abraza todo vuestro cuerpo. Abandonaos totalmente en sus acogedores brazos y al ritmo que mueve el aire con la respiraci\xF3n, moved con vuestro cuerpo el agua tambi\xE9n.

Buscad al Angel del Sol y penetrad en ese abrazo que purifica con llamas santas.

Todas estas cosas son de la Sagrada Ley de la Madre Tierra, Ella quien te dio a luz.

El que ha encontrado Paz en el cuerpo ha construido un Templo Santo donde puede morar por siempre el Esp\xEDritu de Dios.

Conoced esta Paz con vuestra mente, desead esta Paz con vuestro coraz\xF3n, cumplid esta Paz con vuestro cuerpo.`},evening:{angel:"YHWH",element:"El Todo",invocation:"El Padre Celestial y yo somos Uno.",icon:"Stars",symbolImage:"https://blogger.googleusercontent.com/img/a/AVvXsEiHZByElXX4ruuVYQXyo_v3TbBzmxgNRysnj6HkfuEg9xtJQCUKPLVAg3sc9GYlqNjyl3i7Jp-Gh0BoPGhcfjFW1I19AyciUePw3ggC31eEnEwPlMKick9Xi-GnIbUNR1Qu3qiX5Tn3pwufVUxbqV6O3o0qDNZ3pUIe6zH6y-mLvzluejCQDa5ar8UEbig=w640-h358",symbolMeaning:"El Tetragr\xE1maton (las cuatro consonantes hebreas YHWH) erguido en posici\xF3n vertical, similar a una figura humana. La relaci\xF3n entre el 'Primer YHWH' (la Primera Familia de Deidades) y el 'YHWH Universal' (el Todo en Expansi\xF3n).",messenger:"Gabriel",messengerMeaning:`'YHWH Universal' es el 'Todo Universal en Expansi\xF3n' que naci\xF3 del Primer YHWH, seg\xFAn El Deseo Gracioso - el Deseo Creativo - descrito en Mattanah. Cada punto del Ser que ha sido parido por Primero YHWH igualmente siempre lleva a Yah como una Corona. As\xED que hablamos de 'Cuatro Deidades Nasareanas' dentro del Tetragr\xE1maton, pero Yah es el denominador com\xFAn misterioso, una Deidad \xDAltima - Ser Original - que normalmente se deja sin numerar porque es el 'Cero Todav\xEDa'. Yah es siempre el centro y la circunferencia del Todo y de cada parte del Todo.

Abdiel se convirti\xF3 en el \xC1ngel Mensajero de la Rama Central (o principal) del \xC1rbol de la Vida tras ser martirizado por Ca\xEDn y ascender en esp\xEDritu.

Los hechos que llevaron a su transformaci\xF3n ocurrieron de la siguiente manera:

Misi\xF3n de misericordia: Abdiel y su esposa Ishshah viajaron a las regiones de Kush para predicar la palabra del Se\xF1or y la Se\xF1ora y ayudar a los necesitados.

Emboscada de Ca\xEDn: Lucifer instruy\xF3 a Ca\xEDn para obtener un sacrificio humano de sangre con el fin de consagrarse como el primer Sumo Sacerdote del Templo de la Serpiente, por lo que Ca\xEDn embosc\xF3 a la pareja junto a un manantial.

Defensa de la verdad: Abdiel confront\xF3 la falsa doctrina de Ca\xEDn, declarando que el verdadero Yahv\xE9 es amoroso y no desea sacrificios de sangre de hombres ni de bestias.

Muerte f\xEDsica y destino del alma: Ca\xEDn le quit\xF3 la vida terrenal a Abdiel us\xE1ndolo un Bast\xF3n de Fuego. Sin embargo, Ca\xEDn solo mat\xF3 su cuerpo f\xEDsico; el alma de Abdiel fue acogida por el Cordero y la Paloma.

Consagraci\xF3n celestial: El Cordero y la Paloma le otorgaron a Abdiel un cuerpo de Querub\xEDn y el nombre Gabriel (\xABHombre de Elohim\xBB).

Desde ese d\xEDa, se le encomend\xF3 servir como el \xC1ngel Mensajero de la Rama Central del \xC1rbol de la Vida para este mundo hasta el fin de los tiempos. Poco despu\xE9s, su esposa Ishshah tambi\xE9n fue martirizada y elevada como Ishshah'el (\xC1ngel Mensajero de la Ra\xEDz Central), quedando ambos unidos como consortes eternos en el \xC1rbol de la Vida.`,videoUrl:"https://youtube.com/shorts/_iyFhDU1II0",meditationText:"Di estas palabras: 'HaShem, El Nombre sobre todo Nombre, YHWH. Dios y Diosa Trascendente: \xA1Jah y Jahlah! Dios y Diosa Inmanentes: \xA1Jahday y Jahnah! La Primera Familia, que se expande para convertirse en la Familia de Todos. Soy uno, con la Primera Familia. Yo soy uno, con HaShem, YHW H. HaShem, YHW H. HaShem, YHW H. HaShem, YH WH .'"}},6:{name:"S\xE1bado",morning:{angel:"Madre Tierra",element:"Nutrici\xF3n",invocation:"La Madre Tierra y yo somos Uno. Ella da el alimento de la vida a todo mi cuerpo.",icon:"Flower",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhWvScZ7z7yYxP_GvnLeU9C32GvxcH2uCB3sLc1XymdCQRC4muLN9idFKqoOeorq6UFNHCreTYslQQOQFGehY7dbLFL6LV2NFV9U_FDTkz6C3nvNSE9Z4TzoHTtuwXnBZK_F-UaK5UPEqXYWQkGwX1QM8CfCB0zA-gD_Yd8PtmS-WK2ELYFp9q5cKe0NPc/s16000/Gemini_Generated_Image_qp8hleqp8hleqp8h.png",symbolMeaning:"Una espiral dentro de un c\xEDrculo, que representa el torbellino creativo dentro del c\xEDrculo de la naturaleza. La evoluci\xF3n espiritual de los seres humanos y de las dem\xE1s criaturas encarnadas en la Tierra, entendiendo al planeta mismo como un ser vivo en continua evoluci\xF3n.",messenger:"Ishshah'el",messengerMeaning:`Ishshah'el impulsa la defensa de la salud planetaria mediante el llamado 'Ej\xE9rcito Verde' (junto a Pedro la Pluma), el cual tambi\xE9n trabaja para preservar la naturaleza.

Ishshah fue una figura fundamental en la comunidad nasareana, reconocida por su profunda conexi\xF3n con la naturaleza, su labor sanadora y su amor maternal hacia todos los seres vivos.

\xBFQui\xE9n era Ishshah en vida?
Matriarca y educadora: Fue esposa de Abdiel y madre de siete hijos, entre ellos Enoc, a quien ense\xF1\xF3 la medicina de las hierbas y el amor por las bellezas de la creaci\xF3n.
\xABLa Mujer Verde Bailarina\xBB: Vest\xEDa una t\xFAnica verde y adornaba su cabello rojo con hiedra. Sol\xEDa cantar y bailar en los bosques, curando tanto a personas como a animales, plantas e insectos. Por su instinto maternal hacia todas las criaturas, la comunidad la llamaba cari\xF1osamente Emah (\xABMam\xE1\xBB).

Su martirio a manos de Ca\xEDn
Misi\xF3n de misericordia: Ishshah y Abdiel viajaron por las regiones de Kush curando y ense\xF1ando el camino del Se\xF1or y la Se\xF1ora.
Emboscada: Mientras curaba a un p\xE1jaro herido junto a un manantial, Ca\xEDn y sus soldados los emboscaron. Ca\xEDn buscaba un sacrificio humano nasareano para consagrarse como el primer Sumo Sacerdote de Lucifer.
El sacrificio: Al ver a Abdiel atacado, Ishshah intent\xF3 asistirlo, pero fue herida con el Bast\xF3n de Fuego. Tras asesinar a Abdiel, Ca\xEDn la someti\xF3 y la llev\xF3 a una cueva oscura, donde la sacrific\xF3 en el altar del falso Yahv\xE9.

Su transformaci\xF3n en \xC1ngel Mensajero de la Ra\xEDz Central
Elevaci\xF3n celestial: Ca\xEDn solo logr\xF3 destruir su cuerpo terrenal. El alma de Ishshah ascendi\xF3 hacia el Cordero y la Paloma, quienes le otorgaron un cuerpo inmortal de Queruba y el nombre Ishshah'el (\xABMujer de Elohim\xBB).
Nombramiento divino: Se le encomend\xF3 ser el \xC1ngel Mensajero de la Ra\xEDz Central del \xC1rbol de la Vida para este mundo.
La Shekinah: Debido a su funci\xF3n de manifestar la Presencia Divina en el reino f\xEDsico, tambi\xE9n recibe el t\xEDtulo de Shekinah.
Consortes eternos: Puesto que la Ra\xEDz Central y la Rama Central est\xE1n unidas eternamente en el \xC1rbol de la Vida, Ishshah'el y Gabri'el (Abdiel) quedaron constituidos como consortes y compa\xF1eros eternos en los cielos de Elkush.`,videoUrl:"https://youtube.com/shorts/8X1KseYisoQ",meditationText:"Di estas palabras: 'Madre Tierra, mi cuerpo es uno con tu cuerpo. Caminar\xE9 suavemente sobre tu carne. Te defender\xE9 de la mano del despojador. Ser\xE9 amable con los animales: no cazar\xE9; No comer\xE9 carne animal. \xA1La ayudar\xE1 a que la Tierra vuelva a ser un jard\xEDn paradis\xEDaco! \xA1Oh Madre, me amamanto de tu pecho!'"},midday:{angel:"Paz con el Reino del Padre Celestial",element:"Reino Celestial",invocation:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a Tu Reino, Padre Celestial, Tu \xC1ngel de la Vida Eterna.",icon:"Stars",symbolImage:"https://blogger.googleusercontent.com/img/a/AVvXsEjZQNzwsMbFypmjgPolnm5QwsLdhaacpdqZlxAfhCynU5BUd_M-skB8Eq1-xcK25Dw0I2ZGru8pUioKor6_AIJl9NC2NFgCHlIN3C2I2mhgWt-Tqh1m3bZ2_Y4Gfzo4OiFzr-uhvXk-ZTt_eQCR9iB-vt49qrFuxPB0JyaacZ4cG8WK-_MWHNdHBZcULAI=w640-h358",symbolMeaning:"Es la paz suprema y total que contiene y corona a todos los dem\xE1s aspectos de la S\xE9ptuple Paz. Su concepto representa la superaci\xF3n de la ilusi\xF3n de separaci\xF3n individual y la integraci\xF3n consciente con la \xDAnica Ley que gobierna la totalidad del cosmos y de la vida.",meditationText:"Padre nuestro que est\xE1s en los cielos, m\xE1ndanos a todos Tu \xC1ngel de la Paz; y a Tu Reino, Padre Celestial, Tu \xC1ngel de la Vida Eterna.",wordsOfYahshua:`Bienaventurado es el Hijo de la Luz que busca a su Padre Celestial, ya que tendr\xE1 Vida Eterna. El que mora en el lugar secreto del Supremo, morar\xE1 bajo el amparo del todopoderoso. Pues El enviar\xE1 sus \xE1ngeles sobre \xE9l para protegerle en todos sus senderos. Sabed vosotros que el Se\xF1or ha sido vuestra morada en todas las generaciones.

Antes que las monta\xF1as surgieran, por siempre, El ha formado la Tierra y el universo. Si por los siglos de los siglos ha existido Amor entre el Padre Celestial y sus hijos, \xBFc\xF3mo este Amor se va a romper? Si desde el principio hasta el final de los tiempos la llama santa de Amor rodea las cabezas del Padre Celestial y los hijos de la Luz \xBFc\xF3mo se extinguir\xE1 este Amor entonces?

Pues no es como una llama que se prende, ni a\xFAn como un fuego impetuoso en el bosque. Mirad, El arde con la llama de la Luz Eterna y esa llama no se puede consumir. Vosotros que am\xE1is a vuestro Padre Celestial, haced pues su voluntad.

Caminad con sus \xE1ngeles santos y hallad la Paz en su Ley Santa, pues su Ley es la Ley total, si, es la Ley de Leyes. A trav\xE9s de su Ley ha hecho que la Tierra y los cielos sean uno, las monta\xF1as y el mar son sus apoyos. Con sus manos El nos form\xF3 y nos cre\xF3 y nos dio el entendimiento para que aprendi\xE9ramos su Ley.

La Luz lo cubre como un manto, extiende los cielos como una cortina, hace de las nubes su veh\xEDculo, camina en las alas del viento, env\xEDa la primavera a los valles y su aliento est\xE1 en los \xE1rboles poderosos. En su mano est\xE1n los lugares rec\xF3nditos de la Tierra, la fortaleza de los mares tambi\xE9n es suya, el mar es suyo y sus manos formaron la tierra firme. Todos los cielos narran la Gloria de Dios y el firmamento muestra su Ley. Y a sus disc\xEDpulos El les deja su Reino, a aquellos que caminan con sus \xE1ngeles y encuentran la Paz en su sagrada Ley.

\xBFDese\xE1is saber m\xE1s, mis disc\xEDpulos? \xBFC\xF3mo podremos expresar en nuestros labios aquello de lo que no se puede hablar? Es como cuando un mudo se come una granada, \xBFc\xF3mo puede \xE9l hablarnos de su sabor? Si decimos que el Padre celestial mora en nosotros y luego se averg\xFCenzan los cielos, es mentira si decimos que El mora en nosotros.

Es el ojo que escudri\xF1a el horizonte lejano y el ojo que ve los corazones de los hombres, El se comporta como un ojo.

El no se manifiesta, no se oculta, El no es revelado, ni es irrevelable. Mis disc\xEDpulos, no hay palabras para decir lo que es. Lo \xFAnico que si sabemos es que somos sus hijos y que El es nuestro Padre. El es nuestro Dios y nosotros los descendientes de su tierra de pastoreo y las ovejas de su reba\xF1o.

El que encuentra la Paz en su Padre Celestial ha entrado al Santuario de la Sagrada Ley y ha celebrado un pacto con Dios, que perdurar\xE1 por siempre.

Conoced esta Paz con vuestra mente, desead esta Paz con vuestro coraz\xF3n, cumplid esta Paz con vuestro cuerpo.

Aunque el cielo y la tierra pasen, ni una letra de la Sagrada Ley cambiar\xE1 o pasar\xE1; pues en el principio fue la Ley y la Ley estaba en Dios y la Ley era Dios.

La s\xE9ptuple Paz del Padre Celestial sea siempre contigo.`},evening:{angel:"\xC1ngel de la Vida Eterna",element:"Inmortalidad",invocation:"\xC1ngel de la Vida Eterna, desciende sobre la humanidad y da vida eterna a todos los hombres.",icon:"Infinity",symbolImage:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgbiYIW_ZcwlgS-GPTbynqGVdZbqXRmuop7tP4dby2GjjHwwdW91Q86lU7Lhz4GHliKxhDrNpASa5P-ktX4Rvdy8sh7qJ7GC7VLmeiLnfIyVIsOnn446i42Ag3IWsFwXaZoYijnGYvAhrR5QE67wqbr0aFpZo8QZMWHm1n9ec8LJqZC83fgyod-m1iaDrU/w430-h640/Gemini_Generated_Image_17z0cj17z0cj17z0.png",symbolMeaning:"El signo del infinito con cuatro flechas (dos salientes de 'Desbordamiento' y dos entrantes de 'Afluencia', indicando que la salida es igual a la entrada). Alternativamente, la ilustraci\xF3n del Ave F\xE9nix Thoth. La relaci\xF3n entre vidas pasadas, futuras y el significado profundo de la vida actual en el Eterno Ahora.",messenger:"Gilgal'el",messengerMeaning:"Gilgalah significa Rueda, y este era un nombre perfecto para ella, porque el \xC1ngel de la Vida Eterna es el Maestro de la Puerta de la Rueda de las Constelaciones. Y esa rueda es Ha Ophanha Gilgal, que significa La Rueda Giratoria. S\xED, esta es la rueda de los tiempos, las estaciones y los ciclos, y el ministerio del \xC1ngel Principal de la Vida Eterna es ayudarlo a usted y a otros a progresar en esa Rueda. He aqu\xED: es como si Gilgalah hubiera nacido para convertirse en ese \xC1ngel; porque ella fue la primera maestra astr\xF3loga y creadora de calendarios de los nasareanos, y cre\xF3 los or\xE1culos nasareanos, \xA1incluido Qashab!",videoUrl:"https://youtube.com/shorts/VQC628AuNLM",meditationText:"Di estas palabras: '\xC1ngel de la Vida Eterna, Maestro de la Puerta de la Rueda de las Constelaciones, vela por m\xED de vida en vida, por muchos mundos y cielos, hasta llegar al Cielo Alt\xEDsimo! \xA1Mi existencia eterna es un regalo de Jah-Jah! \xA1Ay\xFAdame a aprovechar al m\xE1ximo ese don, oh Sierva del Alt\xEDsimo!'"}}},Zs=
